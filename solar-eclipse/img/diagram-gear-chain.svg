<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#58697f"/>
    </marker>
  </defs>
  <style>
    .panel{fill:#f4f7fb;stroke:#d5dfeb;stroke-width:1.5;}
    .ptitle{fill:#142c4e;font-size:15px;font-weight:bold;}
    .psub{fill:#586980;font-size:11.5px;}
    .cam{fill:#e9d9b8;stroke:#cdb684;stroke-width:1.5;}
    .app{fill:#d6e2f1;stroke:#b0c3db;stroke-width:1.5;}
    .hm{fill:#142c4e;stroke:#142c4e;}
    .mount{fill:#dcd8e8;stroke:#b7aecf;stroke-width:1.5;}
    .bt{fill:#162234;font-size:13px;font-weight:bold;text-anchor:middle;}
    .btw{fill:#cee0f4;font-size:13px;font-weight:bold;text-anchor:middle;}
    .bs{fill:#586980;font-size:10px;text-anchor:middle;}
    .bsw{fill:#9db4cf;font-size:10px;text-anchor:middle;}
    .link{stroke:#58697f;stroke-width:2;fill:none;marker-end:url(#ga);}
    .lt{fill:#58697f;font-size:10.5px;text-anchor:middle;}
    .note{fill:#8a5a00;font-size:11px;font-style:italic;}
  </style>

  <text x="12" y="24" fill="#162234" font-size="16px" font-weight="bold">The two rig layouts</text>

  <!-- ===== Panel A: shared camera for full solar disk imaging ===== -->
  <rect class="panel" x="10" y="38" width="940" height="190" rx="12"/>
  <text class="ptitle" x="28" y="64">A. Shared camera <tspan fill="#1e874b">(full solar disk)</tspan></text>
  <text class="psub" x="28" y="82">One camera does both jobs: HelioMaker forwards its frames to PHD2 for guiding between captures.</text>

  <rect class="cam"   x="28"  y="108" width="136" height="52" rx="8"/>
  <text class="bt" x="96"  y="130">One camera</text><text class="bs" x="96"  y="147">images &amp; guides</text>
  <rect class="app"   x="214" y="108" width="126" height="52" rx="8"/>
  <text class="bt" x="277" y="130">SharpCap Pro</text><text class="bs" x="277" y="147">camera control</text>
  <rect class="hm"    x="400" y="108" width="146" height="52" rx="8"/>
  <text class="btw" x="473" y="126">HelioMaker</text>
  <text class="bsw" x="473" y="139" style="font-size:8.5px;">plans, coordinates eclipse</text>
  <text class="bsw" x="473" y="150" style="font-size:8.5px;">capture, and tracks the Sun</text>
  <rect class="app"   x="612" y="108" width="104" height="52" rx="8"/>
  <text class="bt" x="664" y="130">PHD2</text><text class="bs" x="664" y="147">virtual camera</text>
  <rect class="mount" x="792" y="108" width="110" height="52" rx="8"/>
  <text class="bt" x="847" y="130">Mount</text><text class="bs" x="847" y="147">tracks the Sun</text>

  <line class="link" x1="164" y1="134" x2="212" y2="134"/><text class="lt" x="188" y="126">USB</text>
  <line class="link" x1="340" y1="134" x2="398" y2="134"/><text class="lt" x="369" y="126">link</text>
  <line class="link" x1="546" y1="134" x2="610" y2="134"/><text class="lt" x="578" y="126">frames</text>
  <line class="link" x1="716" y1="134" x2="790" y2="134"/><text class="lt" x="753" y="126">pulses</text>

  <text class="note" x="28" y="190">Guiding pauses around C2 and C3 and throughout totality while the mount tracks through the brief gap.</text>
  <text class="note" x="28" y="206">As the limb becomes bright enough after C3, guiding recenters the Sun automatically.</text>

  <!-- ===== Panel B: separate guiding camera — below ===== -->
  <rect class="panel" x="10" y="244" width="940" height="246" rx="12"/>
  <text class="ptitle" x="28" y="270">B. Separate guiding camera</text>
  <text class="psub" x="28" y="288">A guide scope with its own camera can guide inside totality while the imaging camera captures.</text>

  <rect class="cam"   x="28"  y="314" width="136" height="52" rx="8"/>
  <text class="bt" x="96"  y="336">Imaging camera</text><text class="bs" x="96"  y="353">main scope</text>
  <rect class="app"   x="214" y="314" width="126" height="52" rx="8"/>
  <text class="bt" x="277" y="336">SharpCap Pro</text><text class="bs" x="277" y="353">camera control</text>
  <rect class="hm"    x="400" y="314" width="146" height="52" rx="8"/>
  <text class="btw" x="473" y="332">HelioMaker</text>
  <text class="bsw" x="473" y="345" style="font-size:8.5px;">plans, coordinates eclipse</text>
  <text class="bsw" x="473" y="356" style="font-size:8.5px;">capture, and tracks the Sun</text>
  <rect class="app"   x="612" y="314" width="104" height="52" rx="8"/>
  <text class="bt" x="664" y="336">PHD2</text><text class="bs" x="664" y="353">guiding</text>
  <rect class="mount" x="792" y="314" width="110" height="52" rx="8"/>
  <text class="bt" x="847" y="336">Mount</text><text class="bs" x="847" y="353">tracks the Sun</text>

  <rect class="cam"   x="214" y="400" width="136" height="52" rx="8"/>
  <text class="bt" x="282" y="422">Guiding camera</text><text class="bs" x="282" y="439">guide scope</text>

  <line class="link" x1="164" y1="340" x2="212" y2="340"/><text class="lt" x="188" y="332">USB</text>
  <line class="link" x1="340" y1="340" x2="398" y2="340"/><text class="lt" x="369" y="332">link</text>
  <line class="link" x1="546" y1="340" x2="610" y2="340"/><text class="lt" x="578" y="332">guide data</text>
  <line class="link" x1="716" y1="340" x2="790" y2="340"/><text class="lt" x="753" y="332">pulses</text>
  <path class="link" d="M 350 426 C 500 426, 540 392, 636 370"/>
  <text class="lt" x="452" y="444">guiding via PHD2's own camera</text>
</svg>
